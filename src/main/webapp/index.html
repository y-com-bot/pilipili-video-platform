<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>pilipili - 主页</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <style>
        body { margin: 0; background-color: #f4f5f7; font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif; }
        .header { background-color: #fff; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-shadow: 0 2px 4px rgba(0,0,0,.08); margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: #00a1d6; /* 经典的 b站蓝 */ cursor: pointer; }
        .video-card { margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
        .video-card:hover { transform: translateY(-5px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .video-cover { width: 100%; height: 180px; background-color: #e7e7e7; display: flex; align-items: center; justify-content: center; color: #999; border-radius: 4px; }
        .video-title { margin-top: 10px; font-size: 14px; font-weight: 500; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <div class="logo">pilipili</div>
        <div>
            <template v-if="isLoggedIn">
                <span style="margin-right: 16px; color: #606266; font-size: 14px;">当前角色：{{ currentRole }}</span>
                <el-button type="primary" @click="dialogVisible = true">发布视频</el-button>
                <el-button v-if="isAdmin" type="warning" @click="goToAdmin" style="margin-left: 10px;">管理后台</el-button>
                <el-button type="danger" plain @click="logout" style="margin-left: 10px;">退出登录</el-button>
                <div v-if="!isAdmin" style="margin-top: 8px; color: #999; font-size: 12px;">当前账号不是管理员，管理员登录后可见“管理后台”和删除按钮。管理员后台地址：/admin.html</div>
            </template>
            <template v-else>
                <el-button type="primary" @click="goToLogin">登录 / 注册</el-button>
            </template>
        </div>
    </div>

    <div style="padding: 0 40px;">
        <el-row :gutter="20">
            <el-col :span="6" v-for="video in videoList" :key="video.id">
                <el-card shadow="hover" class="video-card" :body-style="{ padding: '10px' }">
                    <div class="video-cover" @click="goToDetail(video.id)">
                        ▶ 点击播放
                    </div>
                    <div class="video-title" :title="video.title" @click="goToDetail(video.id)">{{ video.title }}</div>
                    <div v-if="isAdmin" style="margin-top: 10px;">
                        <el-button type="danger" size="small" @click="deleteVideo(video.id)">删除</el-button>
                    </div>
                </el-card>
            </el-col>
        </el-row>
        <el-empty v-if="videoList.length === 0" description="这里空空如也，快来发布第一个视频吧！"></el-empty>
    </div>

    <el-dialog v-model="dialogVisible" title="发布新视频" width="500px">
        <el-form :model="postForm" label-width="80px">
            <el-form-item label="视频标题">
                <el-input v-model="postForm.title" placeholder="起个吸引人的标题吧"></el-input>
            </el-form-item>
            <el-form-item label="视频地址">
                <el-input v-model="postForm.videoUrl" placeholder="请输入视频外链 (如 .mp4 结尾)"></el-input>
            </el-form-item>
            <el-form-item label="视频简介">
                <el-input v-model="postForm.description" type="textarea" placeholder="这里如果有视频该多好？"></el-input>
            </el-form-item>
        </el-form>
        <template #footer>
                <span class="dialog-footer">
                    <el-button @click="dialogVisible = false">取 消</el-button>
                    <el-button type="primary" @click="submitVideo">确 定 发 布</el-button>
                </span>
        </template>
    </el-dialog>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
    const { createApp, ref, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
        setup() {
            const videoList = ref([]);
            const isLoggedIn = ref(false);
            const isAdmin = ref(false);
            const currentRole = ref('guest');
            const dialogVisible = ref(false);
            const postForm = ref({ title: '', videoUrl: '', description: '' });

            // 从 JWT 中解析 role
            const decodeToken = (token) => {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map((c) => {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            };

            // 页面一加载就执行的逻辑
            onMounted(() => {
                // 检查本地有没有 Token
                const token = localStorage.getItem('cyber_token');
                isLoggedIn.value = !!token; // 如果有token，说明登录了

                if (token) {
                    const payload = decodeToken(token);
                    if (payload && payload.role) {
                        currentRole.value = payload.role;
                        isAdmin.value = payload.role === 'admin';
                    } else {
                        currentRole.value = 'user';
                    }
                }

                // 去后端拉取视频列表
                loadVideos();
            });

            // 拉取视频列表
            const loadVideos = () => {
                axios.get('/video').then(res => {
                    videoList.value = res.data; // 把后端返回的 JSON 数组直接塞给 Vue
                }).catch(err => {
                    ElMessage.error("获取视频列表失败");
                });
            };

            // 发布视频 (携带 Token 的核心操作！)
            const submitVideo = () => {
                if (!postForm.value.title || !postForm.value.videoUrl) {
                    ElMessage.warning('标题和视频地址不能为空');
                    return;
                }

                const params = new URLSearchParams();
                params.append('title', postForm.value.title);
                params.append('videoUrl', postForm.value.videoUrl);
                params.append('description', postForm.value.description);

                // 在请求头里带上我们偷偷存的 Token
                const config = {
                    headers: {
                        'Authorization': localStorage.getItem('cyber_token')
                    }
                };

                axios.post('/video', params, config).then(res => {
                    ElMessage.success('发布成功！');
                    dialogVisible.value = false; // 关掉弹窗
                    postForm.value = { title: '', videoUrl: '', description: '' }; // 清空表单
                    loadVideos(); // 重新加载视频列表，立刻看到新发的内容
                }).catch(err => {
                    if (err.response && err.response.status === 401) {
                        ElMessage.error('登录已失效，请重新登录');
                        logout();
                    } else {
                        ElMessage.error('发布失败');
                    }
                });
            };

            const goToLogin = () => { window.location.href = '/auth.html'; };
            const goToAdmin = () => { window.location.href = '/admin.html'; };
            const logout = () => {
                localStorage.removeItem('cyber_token'); // 撕毁门禁卡
                isLoggedIn.value = false;
                isAdmin.value = false;
                ElMessage.success('已退出登录');
            };
            const goToDetail = (id) => {
                // 跳转到视频详情页，并在 URL 后面带上视频 ID
                // 例如: /video-detail.html?id=5
                window.location.href = '/video-detail.html?id=' + id;
            };
            const deleteVideo = (videoId) => {
                ElMessageBox.confirm('是否确认删除该视频？', '删除视频', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    const params = new URLSearchParams();
                    params.append('videoId', videoId);
                    const config = {
                        headers: {
                            'Authorization': localStorage.getItem('cyber_token')
                        }
                    };
                    axios.post('/admin/deleteVideo', params, config).then(res => {
                        if (res.data.success) {
                            ElMessage.success(res.data.message);
                            loadVideos(); // 重新加载列表
                        } else {
                            ElMessage.error(res.data.message);
                        }
                    }).catch(err => {
                        if (err.response && err.response.status === 403) {
                            ElMessage.error('您无权执行此操作');
                        } else {
                            ElMessage.error('删除失败');
                        }
                    });
                }).catch(() => {
                    ElMessage.info('已取消删除');
                });
            };

            return {
                videoList, isLoggedIn, isAdmin, currentRole, dialogVisible, postForm,
                submitVideo, goToLogin, goToAdmin, logout, goToDetail, deleteVideo
            };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
