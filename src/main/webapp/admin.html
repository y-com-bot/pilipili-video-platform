<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>pilipili - 管理后台</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <style>
        body { margin: 0; background-color: #f4f5f7; font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', Arial, sans-serif; }
        .header { background-color: #fff; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-shadow: 0 2px 4px rgba(0,0,0,.08); margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: #00a1d6; cursor: pointer; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .stat-number { font-size: 32px; font-weight: bold; color: #00a1d6; }
        .stat-label { color: #666; margin-top: 10px; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <div class="logo" @click="goHome">pilipili 管理后台</div>
        <div>
            <el-button type="primary" @click="goHome">返回首页</el-button>
            <el-button type="danger" plain @click="logout" style="margin-left: 10px;">退出登录</el-button>
        </div>
    </div>

    <div class="main-container" v-if="isAdmin">
        <el-row :gutter="20" style="margin-bottom: 30px;">
            <el-col :span="6">
                <div class="stat-card">
                    <div class="stat-number">{{ stats.totalVideos }}</div>
                    <div class="stat-label">总视频数</div>
                </div>
            </el-col>
            <el-col :span="6">
                <div class="stat-card">
                    <div class="stat-number">{{ stats.totalComments }}</div>
                    <div class="stat-label">总评论数</div>
                </div>
            </el-col>
            <el-col :span="6">
                <div class="stat-card">
                    <div class="stat-number">{{ stats.totalUsers }}</div>
                    <div class="stat-label">总用户数</div>
                </div>
            </el-col>
            <el-col :span="6">
                <div class="stat-card">
                    <div class="stat-number">{{ stats.totalLikes }}</div>
                    <div class="stat-label">总点赞数</div>
                </div>
            </el-col>
        </el-row>

        <div style="background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);">
            <h3>视频管理</h3>
            <el-table :data="videoList" stripe style="width: 100%">
                <el-table-column prop="id" label="ID" width="60"></el-table-column>
                <el-table-column prop="title" label="视频标题" show-overflow-tooltip></el-table-column>
                <el-table-column prop="uploaderName" label="上传者"></el-table-column>
                <el-table-column prop="likeCount" label="点赞数" width="80"></el-table-column>
                <el-table-column label="操作" width="150">
                    <template #default="scope">
                        <el-button type="danger" size="small" @click="deleteVideo(scope.row.id)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-empty v-if="videoList.length === 0" description="没有视频数据"></el-empty>
        </div>
    </div>

    <div v-else class="main-container" style="margin-top: 50px; text-align: center;">
        <el-result icon="error" title="访问被拒绝" sub-title="您没有权限访问此页面">
            <template #extra>
                <el-button type="primary" @click="goHome">返回首页</el-button>
            </template>
        </el-result>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
    const { createApp, ref, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
        setup() {
            const isAdmin = ref(false);
            const videoList = ref([]);
            const stats = ref({
                totalVideos: 0,
                totalComments: 0,
                totalUsers: 0,
                totalLikes: 0
            });

            // 从 JWT 中解析 role
            const decodeToken = (token) => {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map((c) => {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            };

            onMounted(() => {
                const token = localStorage.getItem('cyber_token');
                if (!token) {
                    ElMessage.error('请先登录');
                    setTimeout(() => window.location.href = '/auth.html', 1000);
                    return;
                }

                const payload = decodeToken(token);
                if (!payload || payload.role !== 'admin') {
                    ElMessage.error('您无权访问此页面');
                    setTimeout(() => window.location.href = '/index.html', 1000);
                    return;
                }

                isAdmin.value = true;
                loadVideoList();
                loadStats();
            });

            const getConfig = () => ({
                headers: { 'Authorization': localStorage.getItem('cyber_token') }
            });

            const loadVideoList = () => {
                axios.get('/video').then(res => {
                    videoList.value = res.data;
                }).catch(err => {
                    ElMessage.error('获取视频列表失败');
                });
            };

            const loadStats = () => {
                axios.get('/admin/stats', getConfig()).then(res => {
                    stats.value = {
                        totalVideos: res.data.totalVideos || 0,
                        totalComments: res.data.totalComments || 0,
                        totalUsers: res.data.totalUsers || 0,
                        totalLikes: res.data.totalLikes || 0
                    };
                }).catch(err => {
                    const message = err.response?.data?.message || err.response?.data || err.message || '获取统计数据失败';
                    ElMessage.error(message);
                    if (err.response && (err.response.status === 401 || err.response.status === 403)) {
                        setTimeout(() => { window.location.href = '/auth.html'; }, 1200);
                    }
                });
            };

            const deleteVideo = (videoId) => {
                ElMessageBox.confirm('确认删除此视频吗？', '警告', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    const params = new URLSearchParams();
                    params.append('videoId', videoId);
                    axios.post('/admin/deleteVideo', params, getConfig()).then(res => {
                        if (res.data.success) {
                            ElMessage.success(res.data.message);
                            loadVideoList();
                        } else {
                            ElMessage.error(res.data.message);
                        }
                    }).catch(err => {
                        ElMessage.error('删除视频失败');
                    });
                }).catch(() => {
                    ElMessage.info('已取消删除');
                });
            };

            const goHome = () => { window.location.href = '/index.html'; };
            const logout = () => {
                localStorage.removeItem('cyber_token');
                ElMessage.success('已退出登录');
                setTimeout(() => window.location.href = '/auth.html', 1000);
            };

            return {
                isAdmin, videoList, stats,
                loadVideoList, deleteVideo, goHome, logout
            };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
